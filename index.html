<!DOCTYPE html>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#04101a;color:#e6f4ff;
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #hud{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px 6px;font-variant-numeric:tabular-nums}
  #hud .lv{font-weight:700;font-size:17px;letter-spacing:.04em}
  #pct{font-size:14px;opacity:.9}

  #meter{flex:0 0 auto;margin:0 14px 6px;height:8px;border-radius:5px;background:#0f2433;overflow:hidden;position:relative}
  #meterFill{height:100%;width:0;background:linear-gradient(90deg,#3cc8ff,#9af0ff);border-radius:5px;transition:width .2s}
  #meterLost{position:absolute;right:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(45deg,#7a5a1a 0 4px,#4d3810 4px 8px)}

  button{font:inherit;color:#e6f4ff;background:#11293a;border:1px solid #23506b;border-radius:12px;padding:9px 16px;font-size:15px}
  button:active{transform:scale(.97);background:#173548}
  button.primary{background:linear-gradient(180deg,#2bb8f0,#1478b8);border-color:#5fd2ff;font-weight:700;padding:13px 30px;font-size:18px}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,10,16,.72);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10;padding:24px}
  .overlay.hidden{display:none}
  .card{max-width:360px;width:100%;text-align:center;background:linear-gradient(180deg,#0e2232,#091824);border:1px solid #1f4a63;
    border-radius:22px;padding:28px 22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

  .card h2{margin:4px 0 10px;font-size:24px}

  .card .small{font-size:12.5px;opacity:.6}
  .drop{width:74px;height:74px;margin:0 auto 6px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;

    padding:9px 14px;border-radius:12px;font-size:13.5px;z-index:5;opacity:0;transition:opacity .4s;pointer-events:none;max-width:88vw;text-align:center}

</style>

<body>
<div id="app">
  <div id="hud"><span class="lv" id="lv">第 1 關</span><span id="pct">0%</span><span class="time" id="time">0.0 秒</span></div>

</div>
<div id="toast"></div>

<div class="overlay" id="ovStart"><div class="card">
  <div class="drop"></div>
  <h1>水珠迷宮</h1>
  <p>傾斜手機，讓水珠流向迷宮的<b style="color:#ffd36b">金色出口</b>。<br>水會分裂、也會重新融合——<br>收集 75% 的水就過關。</p>

</div></div>

<div class="overlay hidden" id="ovWin"><div class="card">
  <div class="drop"></div>

</div></div>

<script>
// Particle-based viscoelastic fluid (Clavet et al. 2005, double density relaxation)
// Units: 1 = one maze cell. Time step = 1 substep.
function createSim(o){
  const N=o.n, h=o.h, h2=h*h, pr=o.pr;
  const rho0=o.rho0, k=o.k, kn=o.kn, sig=o.sig, beta=o.beta;
  const W=o.W, H=o.H, kc=o.kc||0;
  const x=new Float32Array(N), y=new Float32Array(N), px=new Float32Array(N), py=new Float32Array(N);
  const vx=new Float32Array(N), vy=new Float32Array(N), alive=new Uint8Array(N);
  const gw=Math.ceil(W/h)+1, gh=Math.ceil(H/h)+1;
  const head=new Int32Array(gw*gh), next=new Int32Array(N);
  const nb=new Int32Array(N*64), nbc=new Int32Array(N);
  const rects=o.rects; // [x0,y0,x1,y1] arrays
  // bucket rects per maze cell
  const buckets=[];
  for(let cy=0;cy<H;cy++)for(let cx=0;cx<W;cx++){
    const b=[];
    for(const r of rects){ if(r[2]>cx-0.3&&r[0]<cx+1.3&&r[3]>cy-0.3&&r[1]<cy+1.3) b.push(r); }
    buckets.push(b);
  }
  function reset(sx,sy,rad){
    let i=0;
    const sp=0.085;
    for(let a=0;i<N&&a<10000;a++){
      // sunflower packing
      const r=Math.sqrt(a+0.5)*sp*0.62, t=a*2.39996;
      x[i]=sx+Math.cos(t)*r; y[i]=sy+Math.sin(t)*r; px[i]=x[i];py[i]=y[i];vx[i]=0;vy[i]=0;alive[i]=1;i++;
    }
  }
  function grid(){
    head.fill(-1);
    for(let i=0;i<N;i++){ if(!alive[i])continue;
      let cx=(x[i]/h)|0, cy=(y[i]/h)|0; if(cx<0)cx=0;if(cy<0)cy=0;if(cx>=gw)cx=gw-1;if(cy>=gh)cy=gh-1;
      const c=cy*gw+cx; next[i]=head[c]; head[c]=i; }
    // neighbor lists (j>i)
    for(let i=0;i<N;i++){ nbc[i]=0; if(!alive[i])continue;
      const cx=(x[i]/h)|0, cy=(y[i]/h)|0;
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const gx=cx+ox, gy=cy+oy; if(gx<0||gy<0||gx>=gw||gy>=gh)continue;
        for(let j=head[gy*gw+gx];j!==-1;j=next[j]){ if(j<=i)continue;
          const dx=x[j]-x[i], dy=y[j]-y[i]; if(dx*dx+dy*dy<h2 && nbc[i]<64){ nb[i*64+nbc[i]++]=j; } }
      }
    }
  }
  function collide(i){
    let cx=Math.floor(x[i]), cy=Math.floor(y[i]);
    if(cx<0)cx=0;if(cy<0)cy=0;if(cx>=W)cx=W-1;if(cy>=H)cy=H-1;
    const b=buckets[cy*W+cx];
    for(let n=0;n<b.length;n++){ const r=b[n]; if(r.door&&r.door.open>0.5)continue;
      const qx=x[i]<r[0]?r[0]:(x[i]>r[2]?r[2]:x[i]);
      const qy=y[i]<r[1]?r[1]:(y[i]>r[3]?r[3]:y[i]);
      let dx=x[i]-qx, dy=y[i]-qy; const d2=dx*dx+dy*dy;
      if(d2<pr*pr){
        if(d2>1e-10){ const d=Math.sqrt(d2), nx=dx/d, ny=dy/d; x[i]=qx+nx*pr; y[i]=qy+ny*pr;
          // friction: damp tangential motion a bit
          const mx=x[i]-px[i], my=y[i]-py[i], vn=mx*nx+my*ny; const tx=mx-vn*nx, ty=my-vn*ny;
          px[i]+=tx*0.04; py[i]+=ty*0.04;
        } else { // center inside rect: push out along least penetration
          const l=x[i]-r[0], rr=r[2]-x[i], t=y[i]-r[1], bb=r[3]-y[i]; const m=Math.min(l,rr,t,bb);
          if(m===l)x[i]=r[0]-pr; else if(m===rr)x[i]=r[2]+pr; else if(m===t)y[i]=r[1]-pr; else y[i]=r[3]+pr; }
      }
    }
    if(x[i]<pr)x[i]=pr; if(y[i]<pr)y[i]=pr; if(x[i]>W-pr)x[i]=W-pr; if(y[i]>H-pr)y[i]=H-pr;
  }
  const vmax=0.06;
  function step(gx,gy){
    grid();
    for(let i=0;i<N;i++){ if(!alive[i])continue; vx[i]+=gx; vy[i]+=gy; }
    // viscosity
    for(let i=0;i<N;i++){ const c=nbc[i]; for(let m=0;m<c;m++){ const j=nb[i*64+m];
      let dx=x[j]-x[i], dy=y[j]-y[i]; const r=Math.sqrt(dx*dx+dy*dy); if(r<1e-6)continue; dx/=r;dy/=r;
      const q=r/h; const u=(vx[i]-vx[j])*dx+(vy[i]-vy[j])*dy;
      if(u>0){ const I=(1-q)*(sig*u+beta*u*u)*0.5; vx[i]-=I*dx;vy[i]-=I*dy;vx[j]+=I*dx;vy[j]+=I*dy; } } }
    for(let i=0;i<N;i++){ if(!alive[i])continue;
      let sx=vx[i], sy=vy[i]; const s=Math.hypot(sx,sy); if(s>vmax){sx*=vmax/s;sy*=vmax/s;}
      px[i]=x[i];py[i]=y[i]; x[i]+=sx; y[i]+=sy; }
    // density relaxation (uses neighbor list built from previous positions — fine for small steps)
    const rho=densTmp, rhon=densTmp2; rho.fill(0); rhon.fill(0);
    for(let i=0;i<N;i++){ const c=nbc[i]; for(let m=0;m<c;m++){ const j=nb[i*64+m];
      const dx=x[j]-x[i], dy=y[j]-y[i]; const r2=dx*dx+dy*dy; if(r2>=h2)continue; const q=1-Math.sqrt(r2)/h;
      const q2=q*q, q3=q2*q; rho[i]+=q2;rho[j]+=q2;rhon[i]+=q3;rhon[j]+=q3; } }
    for(let i=0;i<N;i++){ const c=nbc[i]; if(!c)continue;
      const P=k*(rho[i]-rho0), Pn=kn*rhon[i];
      for(let m=0;m<c;m++){ const j=nb[i*64+m];
        let dx=x[j]-x[i], dy=y[j]-y[i]; const r=Math.sqrt(dx*dx+dy*dy); if(r>=h||r<1e-6)continue;
        const q=1-r/h; const Pj=k*(rho[j]-rho0), Pnj=kn*rhon[j];
        const D=((P+Pj)*0.5*q+(Pn+Pnj)*0.5*q*q - kc*q*(1-q))*0.5/r; dx*=D;dy*=D;
        x[i]-=dx;y[i]-=dy;x[j]+=dx;y[j]+=dy; } }
    for(let i=0;i<N;i++){ if(!alive[i])continue; collide(i);
      vx[i]=(x[i]-px[i])*0.999; vy[i]=(y[i]-py[i])*0.999; }
  }
  const densTmp=new Float32Array(N), densTmp2=new Float32Array(N);
  return {N,x,y,vx,vy,alive,reset,step};
}


</script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const glc=$('gl'), fxc=$('fx'), stage=$('stage'), wrap=$('stageWrap');
const fx=fxc.getContext('2d');
const toast=(t,ms=3200)=>{const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),ms)};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------------- maze ---------------- */
function makeMaze(W,H){
  // walls[y][x] = {n,e,s,w}
  const c=[];for(let y=0;y<H;y++){c.push([]);for(let x=0;x<W;x++)c[y].push({n:1,e:1,s:1,w:1,v:0});}
  const st=[[0,0]];c[0][0].v=1;
  while(st.length){
    const [x,y]=st[st.length-1];const opts=[];
    if(y>0&&!c[y-1][x].v)opts.push([x,y-1,'n','s']);
    if(x<W-1&&!c[y][x+1].v)opts.push([x+1,y,'e','w']);
    if(y<H-1&&!c[y+1][x].v)opts.push([x,y+1,'s','n']);
    if(x>0&&!c[y][x-1].v)opts.push([x-1,y,'w','e']);
    if(!opts.length){st.pop();continue;}
    const o=opts[(Math.random()*opts.length)|0];
    c[y][x][o[2]]=0;c[o[1]][o[0]][o[3]]=0;c[o[1]][o[0]].v=1;st.push([o[0],o[1]]);
  }
  // knock out a few extra walls → loops (more interesting fluid routing)
  const extra=Math.floor(W*H*0.06);
  for(let i=0;i<extra;i++){const x=(Math.random()*(W-1))|0,y=(Math.random()*H)|0;c[y][x].e=0;c[y][x+1].w=0;}
  return {W,H,cells:c};
}
const DOORCOL=[{a:'#ffc061',b:'#d9741c',g:'255,184,80',name:'橘色'},{a:'#ff8ae0',b:'#b23b9c',g:'255,120,220',name:'粉色'}];
const PLATE_K=16, SPONGE_CAP=16;
const DIRS={n:[0,-1],e:[1,0],s:[0,1],w:[-1,0]};
function ekey(x,y,d){ if(d==='w')return (x-1)+','+y+',e'; if(d==='n')return x+','+(y-1)+',s'; return x+','+y+','+d; }
function bfs(m,blocked,sx,sy){
  const {W,H,cells}=m; const dist=new Int32Array(W*H).fill(-1), par=new Int32Array(W*H).fill(-1);
  const q=[sy*W+sx]; dist[q[0]]=0;
  for(let h=0;h<q.length;h++){ const id=q[h],x=id%W,y=(id/W)|0;
    for(const d in DIRS){ if(cells[y][x][d])continue; if(blocked&&blocked.has(ekey(x,y,d)))continue;
      const nx=x+DIRS[d][0],ny=y+DIRS[d][1]; if(nx<0||ny<0||nx>=W||ny>=H)continue; const ni=ny*W+nx;
      if(dist[ni]<0){dist[ni]=dist[id]+1;par[ni]=id;q.push(ni);} } }
  return {dist,par};
}
function wallCount(m,x,y){const k=m.cells[y][x];return k.n+k.e+k.s+k.w;}
function buildRects(m){
  const {W,H,cells:c}=m; const t=0.08, rects=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(c[y][x].n)rects.push([x-t,y-t,x+1+t,y+t]);
    if(c[y][x].w)rects.push([x-t,y-t,x+t,y+1+t]);
    if(y===H-1&&c[y][x].s)rects.push([x-t,H-t,x+1+t,H+t]);
    if(x===W-1&&c[y][x].e)rects.push([W-t,y-t,W+t,y+1+t]);
  }
  for(const dr of m.doors){
    const r=dr.d==='e'?[dr.x+1-t,dr.y-t,dr.x+1+t,dr.y+1+t]:[dr.x-t,dr.y+1-t,dr.x+1+t,dr.y+1+t];
    r.door=dr; dr.rect=r; rects.push(r);
  }
  m.rects=rects;
}
function levelRules(lv){
  const doors=lv>=6?2:(lv>=3?1:0);
  const sponges=lv===2?1:(lv>=4?Math.min(3,1+((lv-4)>>1)):0);
  return {doors,sponges};
}
function designLevel(lv){
  const [W,H]=levelSize(lv); const R=levelRules(lv);
  for(let tries=0;tries<80;tries++){
    const m=makeMaze(W,H); const exitId=(H-1)*W+(W-1);
    const {par}=bfs(m,null,0,0); const path=[]; for(let id=exitId;id!==-1;id=par[id])path.unshift(id);
    const onPath=new Set(path);
    const cands=[];
    for(let i=Math.floor(path.length*0.3);i<Math.min(path.length-1,Math.ceil(path.length*0.85));i++){
      const a=path[i],b=path[i+1]; const ax=a%W,ay=(a/W)|0,bx=b%W,by=(b/W)|0;
      const d=bx>ax?'e':bx<ax?'w':by>ay?'s':'n'; const key=ekey(ax,ay,d);
      if(bfs(m,new Set([key]),0,0).dist[exitId]<0)cands.push({i,key,ax,ay,d});
    }
    if(cands.length<R.doors)continue;
    let chosen=[];
    if(R.doors===1)chosen=[cands[(Math.random()*cands.length)|0]];
    else if(R.doors===2){ const a=cands[(Math.random()*Math.max(1,cands.length*0.5))|0]; const rest=cands.filter(c=>c.i>=a.i+2); if(!rest.length)continue; chosen=[a,rest[(Math.random()*rest.length)|0]]; }
    const used=new Set([0,exitId]); const doors=[]; let ok=true;
    for(let k=0;k<chosen.length;k++){
      const {dist}=bfs(m,new Set(chosen.slice(k).map(c=>c.key)),0,0);
      let opts=[];
      for(let id=0;id<W*H;id++){ if(dist[id]<2||used.has(id)||onPath.has(id))continue; if(wallCount(m,id%W,(id/W)|0)===3)opts.push(id); }
      if(!opts.length)for(let id=0;id<W*H;id++){ if(dist[id]>=2&&!used.has(id)&&!onPath.has(id))opts.push(id); }
      if(!opts.length){ok=false;break;}
      const pid=opts[(Math.random()*opts.length)|0]; used.add(pid);
      const c=chosen[k]; let x=c.ax,y=c.ay,d=c.d;
      if(d==='w'){x-=1;d='e';} else if(d==='n'){y-=1;d='s';}
      doors.push({x,y,d,px:pid%W,py:(pid/W)|0,open:0,count:0,col:DOORCOL[k],wasOpen:false});
    }
    if(!ok)continue;
    const sponges=[]; const spC=path.filter((id,i)=>i>=2&&i<=path.length-2&&!used.has(id));
    while(sponges.length<R.sponges&&spC.length){
      const id=spC.splice((Math.random()*spC.length)|0,1)[0];
      for(let q=spC.length-1;q>=0;q--){const o=spC[q];if(Math.abs(o%W-id%W)+Math.abs(((o/W)|0)-((id/W)|0))<=1)spC.splice(q,1);}
      sponges.push({x:id%W,y:(id/W)|0,wet:0,cap:SPONGE_CAP}); used.add(id);
    }
    if(sponges.length<R.sponges&&tries<79)continue;
    m.doors=doors;m.sponges=sponges;buildRects(m);return m;
  }
  const m=makeMaze(W,H);m.doors=[];m.sponges=[];buildRects(m);return m;
}

/* ---------------- WebGL ---------------- */
const gl=glc.getContext('webgl',{antialias:false,alpha:false,premultipliedAlpha:false,preserveDrawingBuffer:false});
if(!gl){document.body.innerHTML='<p style="padding:30px">此瀏覽器不支援 WebGL。</p>';return;}
const extHF=gl.getExtension('OES_texture_half_float'); gl.getExtension('OES_texture_half_float_linear');
gl.getExtension('EXT_color_buffer_half_float');
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name);}
  return {p,u};}
const splatP=prog(`
attribute vec2 aPos; uniform vec2 uRes; uniform float uSize;
void main(){ vec2 c=aPos/uRes*2.0-1.0; gl_Position=vec4(c.x,-c.y,0.,1.); gl_PointSize=uSize; }`,
`precision mediump float; uniform float uPeak;
void main(){ vec2 d=gl_PointCoord*2.0-1.0; float r2=dot(d,d); if(r2>1.0)discard;
  float w=(1.0-r2); w=w*w*w; gl_FragColor=vec4(w*uPeak,0.,0.,1.); }`);
const compP=prog(`
attribute vec2 aPos; varying vec2 vUv; void main(){ vUv=aPos*0.5+0.5; gl_Position=vec4(aPos,0.,1.); }`,
`precision highp float;
varying vec2 vUv; uniform sampler2D uBg,uF; uniform vec2 uTex; uniform float uK,uThr,uRefr,uT; uniform vec2 uShadow;
float F(vec2 u){ return texture2D(uF,u).r; }
vec3 BG(vec2 u){ return texture2D(uBg,vec2(u.x,1.0-u.y)).rgb; }

  const [gx,gy]=gravity(dt);
  // 3D stage tilt
  stage.style.transform=`rotateX(${(-gy*7).toFixed(2)}deg) rotateY(${(gx*7).toFixed(2)}deg)`;
  if(running&&!won){
    acc+=dt;let n=0;
    while(acc>=SUB&&n<8){sim.step(gx*G,gy*G);acc-=SUB;n++;absorb();}
    if(n===8)acc=0;
    elapsed+=dt;
    mechanics(dt,now);
    if(absorbed>=Math.ceil(need*N))win();
    else if(absorbed+(N-absorbed-lost)<Math.ceil(need*N))lose();
    updateHudThrottled(now);
  }
  render(now);
}
function mechanics(dt,now){
  for(const dr of maze.doors){
    let c=0;const x0=dr.px+0.06,x1=dr.px+0.94,y0=dr.py+0.06,y1=dr.py+0.94;
    for(let i=0;i<N;i++){ if(sim.alive[i]&&sim.x[i]>x0&&sim.x[i]<x1&&sim.y[i]>y0&&sim.y[i]<y1)c++; }
    dr.count=c; const tgt=c>=PLATE_K?1:0; const sp=tgt>dr.open?3.5:1.6;
    dr.open+=Math.sign(tgt-dr.open)*Math.min(Math.abs(tgt-dr.open),sp*dt);
    const isOpen=dr.open>0.5; if(isOpen!==dr.wasOpen){dr.wasOpen=isOpen;try{navigator.vibrate&&navigator.vibrate(isOpen?[15,40,15]:20)}catch(e){}}
  }
  if(bgDirty&&now-bgT>120){bgDirty=false;bgT=now;composeBackground();}
}
function lose(){
  won=true;running=false;updateHud();
  $('winTitle').textContent='水不夠了…';
  $('winText').innerHTML=`海綿吸走了 ${Math.round(lost/N*100)}% 的水，剩下的不夠 ${Math.round(need*100)}% 的過關門檻。<br>試試更快通過海綿，或換條路線。`;
  $('btnNext').style.display='none';$('btnAgain').textContent='再試一次';
  setTimeout(()=>$('ovWin').classList.remove('hidden'),400);
}
let hudT=0;function updateHudThrottled(now){if(now-hudT>100){hudT=now;updateHud();}}
function absorb(){
  const ex=maze.W-0.5, ey=maze.H-0.5, W=maze.W;
  for(let i=0;i<N;i++){ if(!sim.alive[i])continue;
    const si=spongeAt[(Math.floor(sim.y[i])|0)*W+(Math.floor(sim.x[i])|0)];
    if(si>=0){const sp=maze.sponges[si]; if(sp.wet<sp.cap&&Math.random()<1.3/180){sim.alive[i]=0;lost++;sp.wet++;bgDirty=true;continue;}}
    const dx=sim.x[i]-ex, dy=sim.y[i]-ey; if(dx*dx+dy*dy<0.3*0.3){ sim.alive[i]=0; absorbed++;
      if(Math.random()<0.25)ripples.push({t:0});
      if(absorbed%12===0){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
    } }
}
function win(){
  won=true;running=false;updateHud();
  const key='waterMaze_best_'+level, best=parseFloat(store.get(key)||'0');
  let txt=`用時 <b>${elapsed.toFixed(1)}</b> 秒，收集 ${Math.round(absorbed/N*100)}% 的水`+(lost?`（海綿吸走 ${Math.round(lost/N*100)}%）`:'')+'。';
  if(!best||elapsed<best){store.set(key,elapsed.toFixed(2));if(best)txt+='<br>🎉 刷新最佳紀錄！';}
  else txt+=`<br>最佳紀錄 ${best.toFixed(1)} 秒`;
  store.set('waterMaze_level',String(level+1));
  $('winTitle').textContent=`第 ${level} 關 過關！`;$('winText').innerHTML=txt;
  $('btnNext').style.display='';$('btnAgain').textContent='再玩一次這關';
  setTimeout(()=>$('ovWin').classList.remove('hidden'),500);
}
function render(now){
  const S=L.cell*dpr*0.5, ox=L.ox*dpr*0.5, oy=L.oy*dpr*0.5;
  // splat particles
  if(parr.length<N*2)parr=new Float32Array(N*2);
  let c=0;for(let i=0;i<N;i++){if(!sim.alive[i])continue;parr[c*2]=ox+sim.x[i]*S;parr[c*2+1]=oy+sim.y[i]*S;c++;}
  gl.bindFramebuffer(gl.FRAMEBUFFER,fFbo);gl.viewport(0,0,fW,fH);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  if(c){
    gl.useProgram(splatP.p);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
    gl.bindBuffer(gl.ARRAY_BUFFER,pbuf);gl.bufferData(gl.ARRAY_BUFFER,parr.subarray(0,c*2),gl.DYNAMIC_DRAW);
    const loc=gl.getAttribLocation(splatP.p,'aPos');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    gl.uniform2f(splatP.u.uRes,fW,fH);
    const size=Math.min(maxPt,S*0.40);
    gl.uniform1f(splatP.u.uSize,size);
    gl.uniform1f(splatP.u.uPeak,useHalf?0.30:0.11);
    gl.drawArrays(gl.POINTS,0,c);gl.disable(gl.BLEND);
  }
  // composite
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,glc.width,glc.height);
  gl.useProgram(compP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,bgTex);gl.uniform1i(compP.u.uBg,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,fTex);gl.uniform1i(compP.u.uF,1);
  gl.uniform2f(compP.u.uTex,1/fW,1/fH);
  const thr=useHalf?0.55:0.30;
  gl.uniform1f(compP.u.uThr,thr);
  gl.uniform1f(compP.u.uK,(useHalf?1.1:2.6)*Math.max(1,S*0.04));
  gl.uniform1f(compP.u.uRefr,0.045*S/Math.max(fW,fH)*6);
  gl.uniform2f(compP.u.uShadow,S*0.10/fW,-S*0.13/fH);
  gl.uniform1f(compP.u.uT,now/1000);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);const ql=gl.getAttribLocation(compP.p,'aPos');gl.enableVertexAttribArray(ql);gl.vertexAttribPointer(ql,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  drawFx(now);
}
function drawFx(now){
  const w=fxc.width,h=fxc.height;fx.clearRect(0,0,w,h);
  const S=L.cell*dpr, ex=(L.ox+(maze.W-0.5)*L.cell)*dpr, ey=(L.oy+(maze.H-0.5)*L.cell)*dpr;
  // pulsing exit glow
  const p=0.5+0.5*Math.sin(now/300);
  fx.strokeStyle=`rgba(255,215,120,${0.25+0.25*p})`;fx.lineWidth=S*0.03;fx.beginPath();fx.arc(ex,ey,S*(0.36+0.04*p),0,7);fx.stroke();
  const ox=L.ox*dpr, oy=L.oy*dpr;
  for(const dr of maze.doors){
    const cx=ox+(dr.px+0.5)*S,cy=oy+(dr.py+0.5)*S,R=S*0.4, f=Math.min(1,dr.count/PLATE_K);
    fx.lineWidth=S*0.045;fx.lineCap='round';
    fx.strokeStyle='rgba(0,0,0,0.25)';fx.beginPath();fx.arc(cx,cy,R,0,7);fx.stroke();
    if(f>0){fx.strokeStyle=`rgba(${dr.col.g},${0.55+0.45*f})`;fx.beginPath();fx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+f*Math.PI*2);fx.stroke();}
    if(dr.open>0.5){fx.strokeStyle=`rgba(${dr.col.g},${0.3+0.25*Math.sin(now/150)})`;fx.lineWidth=S*0.02;fx.beginPath();fx.arc(cx,cy,R*1.18,0,7);fx.stroke();}
    fx.lineCap='butt';
    // the door itself: sinks into the floor as it opens
    const al=Math.max(0,1-dr.open/0.6); if(al<=0)continue;
    const r=dr.rect,x0=ox+r[0]*S,y0=oy+r[1]*S,x1=ox+r[2]*S,y1=oy+r[3]*S,d=S*0.10*(1-dr.open);
    fx.globalAlpha=al;
    fx.fillStyle='rgba(0,0,0,0.45)';fx.fillRect(x0+S*0.05,y0+S*0.07,x1-x0,y1-y0+d);
    fx.fillStyle=dr.col.b;fx.fillRect(x0,y0+d*0.5,x1-x0,y1-y0+d*0.5);
    const g=fx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,dr.col.a);g.addColorStop(1,dr.col.b);
    fx.fillStyle=g;fx.fillRect(x0,y0-d*0.25,x1-x0,y1-y0);
    fx.strokeStyle='rgba(255,255,255,0.6)';fx.lineWidth=Math.max(1,S*0.012);fx.strokeRect(x0+0.5,y0-d*0.25+0.5,x1-x0-1,y1-y0-1);
    fx.globalAlpha=1;
  }
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t+=1/60;if(r.t>0.8){ripples.splice(i,1);continue;}
    fx.strokeStyle=`rgba(160,230,255,${0.7*(1-r.t/0.8)})`;fx.lineWidth=S*0.02;fx.beginPath();fx.arc(ex,ey,S*(0.12+r.t*0.45),0,7);fx.stroke();}
  // touch joystick
  if(drag){const x=drag.x*dpr,y=drag.y*dpr,R=70*dpr;
    fx.strokeStyle='rgba(180,230,255,0.35)';fx.lineWidth=2*dpr;fx.beginPath();fx.arc(x,y,R,0,7);fx.stroke();
    fx.fillStyle='rgba(180,230,255,0.35)';fx.beginPath();fx.arc(x+tilt.tx*R,y+tilt.ty*R,16*dpr,0,7);fx.fill();}
  // gravity arrow (top-right)
  const m=Math.hypot(gsx,gsy);
  if(m>0.05){const cx=w-34*dpr,cy=26*dpr;fx.save();fx.translate(cx,cy);fx.rotate(Math.atan2(gsy,gsx));
    fx.fillStyle=`rgba(150,220,255,${0.3+0.5*m})`;const l=(8+14*m)*dpr;
    fx.beginPath();fx.moveTo(l,0);fx.lineTo(l-8*dpr,-6*dpr);fx.lineTo(l-8*dpr,6*dpr);fx.closePath();fx.fill();
    fx.fillRect(-4*dpr,-2*dpr,l-8*dpr,4*dpr);fx.restore();}
}

/* ---------------- buttons ---------------- */
$('btnStart').onclick=async()=>{
  $('ovStart').classList.add('hidden');
  await enableSensor();
  const saved=parseInt(store.get('waterMaze_level')||'1',10);
  startLevel(Math.max(1,Math.min(saved,30)));
};
$('btnNext').onclick=()=>startLevel(level+1);
$('btnAgain').onclick=()=>startLevel(level);
$('btnRestart').onclick=()=>startLevel(level);
$('btnCal').onclick=()=>{ if(lastOri||lastMot){ if(lastOri)base={b:lastOri.b,g:lastOri.g}; if(lastMot)mBase={x:lastMot.x,y:lastMot.y}; toast('已將目前角度設為水平');} else showReason(); };
$('btnSensor').onclick=async()=>{ sensorSeen=false; await enableSensor(); };
addEventListener('resize',()=>{if(maze)layout();});
document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0;});

// idle preview behind start screen
setMode('touch');
startLevel(1);running=false;
requestAnimationFrame(frame);
window.__game={startLevel,get maze(){return maze},get sim(){return sim},tilt,get absorbed(){return absorbed},get useHalf(){return useHalf}};
})();
